#workflow fayl nomi yoziladi
name: ci-cd function

#Qachon ishlashi aytiladi
on:
  push:
    branches: ['main'] #main branchga push bolganda ishlasin

#Joblar (vazifalar)
jobs:
  test:  #job nomi
    runs-on: ubuntu-latest #qaysi os da un bolishi

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: barber_go
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345678
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps: #Qadamlar
      - name: Kodni olish #action nomi
        uses: actions/checkout@v4  #bu tayyor action

      - name: Python ornatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

        #kutubxonalrni olish
      - name: requirements.txt ni ornatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test qilish
        env:
          SECRET_KEY: django-insecure-ui&^jvu1f$rqic_k!44b^^b8avg&qf-b(6skdk6vnj9+hgc^ge
          DEBUG: True

          DB_NAME: barber_go
          DB_USER: postgres
          DB_PASSWORD: 12345678
          DB_HOST: 127.0.0.1
          DB_PORT: 5433

          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.gmail.com
          EMAIL_PORT: 587
          EMAIL_USE_TLS: True
          EMAIL_HOST_USER: ismoilow571@gmail.com
          EMAIL_HOST_PASSWORD: ifsxcigtxlnuifbn
          DEFAULT_FROM_EMAIL: ismoilow571@gmail.com

          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
          CHANNEL_LAYERS_HOST: 127.0.0.1
          CHANNEL_LAYERS_PORT: 6379
        run: python manage.py test #terminal buyrugi


#------CD-------
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Codeni checkout qilish
        uses: actions/checkout@v4

        #Docker hub bilan boglanish
      - name: Docker hubga login
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #Imageni psuh qilib build qilsih
      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/barbergo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/barbergo:${{ github.sha }}
            

  #-------Debloy------
  deploy:
    name: Deploy qilish
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: ssh orqali serverga ulanib deploy qilish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Serveringizda 'barbergo' degan papka ochamiz va o'sha yerda ishlaymiz
            mkdir -p ~/barbergo
            cd ~/barbergo
            
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            
            echo "1. Eng yangi Docker image yuklab olinmoqda..."
            docker compose pull web
            
            echo "2. Yangi containerlar ishga tushirilmoqda..."
            docker compose up -d --remove-orphans
            
            echo "3. Eski va keraksiz image'larni tozalash..."
            docker image prune -f
