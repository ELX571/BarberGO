{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BarberGo{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/global.css' %}?v=18">
    <link rel="stylesheet" href="{% static 'css/ai_chat.css' %}?v=15">
    {% block extra_css %}{% endblock %}
</head>
<body>

<div class="app-container">
    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-left">
            <button class="add-btn" id="addPostBtn" style="display: none;" onclick="window.location.href='/create-post/'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        </div>
        
        <div class="nav-center">
            <a href="/" class="nav-brand" style="margin-left: 10px; display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;">Barber<span style="color: #000;">Go</span></span>
                <svg width="44" height="44" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: var(--accent-primary); filter: drop-shadow(0 4px 6px rgba(249, 115, 22, 0.4)); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);" onmouseover="this.style.transform='scale(1.1) rotate(5deg)'" onmouseout="this.style.transform='scale(1) rotate(0deg)'">
                    <path d="M22 56c5-14 16-22 28-22s23 8 28 22c4 11 14 18 22 18-10 8-22 8-33 0-7-5-11-11-17-11s-10 6-17 11c-11 8-23 8-33 0 8 0 18-7 22-18Z" fill="currentColor"/>
                    <path d="M28 56c8 0 14-4 20-10 6 6 12 10 20 10" stroke="#fff7ed" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
                    <circle cx="50" cy="39" r="4.5" fill="#fff7ed" opacity="0.9"/>
                </svg>
            </a>
        </div>
        
        <div class="nav-right" id="authLinks">
            <a href="/login/" class="login-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                Kirish
            </a>
        </div>
    </header>

    <!-- Main Body -->
    <div class="main-layout">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="/" class="sidebar-item active" title="Asosiy (Home)">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </a>
            <a href="/orders-ui/" class="sidebar-item" title="Buyurtmalar (Orders)">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </a>
            <a href="/chat/" class="sidebar-item" title="Chat (Xabarlar)">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            </a>
            <a href="/filters/" class="sidebar-item" id="filterSidebarBtn" title="Filtrlar (Filters)">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
            </a>
            <a href="/hairstyles/" class="sidebar-item" title="Soch turmaklari (Hair Styles)">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>
            </a>
            <a href="/notifications/" class="sidebar-item" title="Bildirishnomalar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </a>
            
            <div style="flex-grow: 1;"></div>
            
            <a href="/profile/" class="sidebar-item" title="Profil">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </a>
        </aside>

        <!-- Content -->
        <main class="content-area">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</div>

<!-- Global Awesome Toast Notification -->
<div class="toast-popup" id="globalToast">
    <div class="toast-controls">
        <button class="toast-ctrl-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
        <button class="toast-ctrl-btn close-btn" onclick="hideGlobalToast()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
    </div>
    
    <div class="toast-content-wrapper">
        <div class="toast-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <div class="toast-icon-badge"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
        </div>
        <div class="toast-text">
            <div class="toast-subtitle">Yangi Vazifa • 3 daqiqa oldin</div>
            <div class="toast-title">Jahoniga eslatmalarni yuboring</div>
        </div>
    </div>
    
    <div class="toast-actions">
        <button class="toast-action-btn secondary" onclick="hideGlobalToast()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg> 
            Keyinroq
        </button>
        <button class="toast-action-btn primary" onclick="hideGlobalToast()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> 
            Bajarildi
        </button>
    </div>
</div>

<!-- Scripts -->
<script src="{% static 'js/ai_chat.js' %}?v=13"></script>
<script src="{% static 'js/global.js' %}?v=6"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    // Global Toast Logic
    function showGlobalToast() {
        const toast = document.getElementById('globalToast');
        if(toast) {
            toast.classList.add('show');
            // Hide after 5 seconds automatically
            setTimeout(() => {
                hideGlobalToast();
            }, 5000);
        }
    }

    function hideGlobalToast() {
        const toast = document.getElementById('globalToast');
        if(toast) {
            toast.classList.remove('show');
        }
    }

    // Initialize AOS Animation Library
    AOS.init({
        duration: 800,
        easing: 'ease-out-cubic',
        once: true,
        offset: 50
    });

    // Update active sidebar item based on URL
    document.addEventListener('DOMContentLoaded', () => {
        const path = window.location.pathname;
        const items = document.querySelectorAll('.sidebar-item');
        items.forEach(item => {
            if (item.getAttribute('href') === path) {
                items.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            }
        });
    });

    // Filter logic is moved to global.js
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
