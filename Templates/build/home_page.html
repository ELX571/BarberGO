{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ request.LANGUAGE_CODE|default:'uz' }}" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <meta name="theme-color" content="#05070c" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
    <title>{% trans "Easy Build" %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f4f6fa;
            --bg-panel: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-label: #94a3b8;
            --link-color: #475569;
            --link-hover-bg: rgba(255, 107, 0, 0.08);
            --active-text-blue: #ff6b00;
            --rail-item-color: #64748b;
            --rail-item-hover-bg: #f1f5f9;
            --divider-col: #e2e8f0;
            --glow-color: rgba(255, 107, 0, 0.25);
            --card-gradient: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.78));
            --input-bg: #ffffff;
            --watermark-color: var(--active-text-blue);
            --watermark-opacity: 0.08;
        }
        [data-theme="dark"] {
            --bg-body: #05070c;
            --bg-panel: rgba(10, 14, 23, 0.78);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-label: #475569;
            --link-color: #cbd5e1;
            --link-hover-bg: rgba(255, 107, 0, 0.06);
            --rail-item-color: #64748b;
            --rail-item-hover-bg: rgba(255,255,255,0.04);
            --divider-col: rgba(255,255,255,0.05);
            --glow-color: rgba(255, 107, 0, 0.35);
            --card-gradient: linear-gradient(135deg, rgba(13, 18, 30, 0.85), rgba(8, 11, 20, 0.7));
            --input-bg: rgba(255, 255, 255, 0.04);
            --watermark-opacity: 0.03;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; overflow-x: hidden; position: relative; }
        body::before, body::after { content: ''; position: fixed; width: 48vw; height: 48vw; min-width: 360px; min-height: 360px; border-radius: 50%; z-index: -1; pointer-events: none; filter: blur(140px); opacity: 0.5; }
        body::before { top: -10%; right: -10%; background: radial-gradient(circle, var(--glow-color) 0%, rgba(0,0,0,0) 70%); }
        body::after { bottom: -10%; left: -10%; background: radial-gradient(circle, rgba(255,107,0,0.1) 0%, rgba(0,0,0,0) 70%); }
        .bg-watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 50vw; color: var(--watermark-color); opacity: var(--watermark-opacity); z-index: -2; pointer-events: none; }

        header {
            background: var(--bg-panel); position: fixed; width: 100%; height: 76px; top: 0; left: 0; z-index: 1000;
            border-bottom: 1px solid var(--border-color); padding: 0 40px; display: flex; align-items: center;
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            padding-top: env(safe-area-inset-top);
        }
        .header-container { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
        .header-left { display: flex; justify-content: flex-start; align-items: center; gap: 12px; }
        .header-center { display: flex; justify-content: center; }
        .header-right { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
        .logo { font-size: 24px; font-weight: 800; color: var(--active-text-blue); text-decoration: none; letter-spacing: -0.8px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .logo span { color: var(--text-main); font-weight: 500; }
        .btn-link, .header-btn {
            text-decoration: none; border: 1px solid var(--border-color); color: var(--text-main);
            background: var(--bg-panel); border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: 14px;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .header-btn.primary { background: var(--active-text-blue); color: #fff; border-color: transparent; box-shadow: 0 4px 12px var(--glow-color); }
        .profile-avatar { width: 42px; height: 42px; border-radius: 14px; object-fit: cover; border: 2px solid var(--border-color); }

        .main-content { margin-left: 120px; padding: 120px 40px 40px 40px; }
        .market-filter-bar { max-width: 760px; margin: 0 auto 24px auto; }
        .search-wrapper {
            position: relative; width: 100%; border-radius: 50px; background: rgba(12, 14, 22, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(32px);
        }
        [data-theme="light"] .search-wrapper { background: rgba(255, 255, 255, 0.95); border-color: rgba(0, 0, 0, 0.09); }
        .search-inner { display: flex; align-items: center; padding: 0 8px 0 0; }
        .premium-search-input { flex: 1; height: 56px; padding: 0 16px 0 52px; background: transparent; border: none; color: var(--text-main); font-size: 16px; font-weight: 500; outline: none; }
        .premium-search-btn {
            flex-shrink: 0; height: 44px; padding: 0 24px; border-radius: 24px; border: none;
            background: linear-gradient(180deg, #ff7a1a 0%, #e85e00 100%); color: #fff; font-size: 14px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .search-icon-premium { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: rgba(100, 116, 139, 0.6); font-size: 15px; }

        .hero-bar {
            max-width: 760px; margin: 0 auto 24px auto; padding: 20px 22px; border: 1px solid var(--border-color);
            border-radius: 22px; background: var(--card-gradient); backdrop-filter: blur(20px); display: flex; justify-content: space-between; gap: 16px; align-items: center;
        }
        .hero-title { font-size: 18px; font-weight: 800; color: var(--text-main); }
        .hero-desc { font-size: 13px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }
        .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

        .compose {
            max-width: 760px; margin: 0 auto 24px auto; padding: 20px; border-radius: 22px; border: 1px solid var(--border-color);
            background: var(--card-gradient); backdrop-filter: blur(20px);
        }
        .compose-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .compose-head h2 { font-size: 16px; font-weight: 800; }
        .compose-grid { display: grid; gap: 12px; }
        .compose-grid input, .compose-grid textarea {
            width: 100%; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main);
            border-radius: 14px; padding: 14px 16px; outline: none; font: inherit;
        }
        .compose-grid textarea { min-height: 120px; resize: vertical; }
        .compose-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
        .compose-actions button, .compose-actions label {
            border: none; cursor: pointer; border-radius: 14px; padding: 12px 16px; font-weight: 700; font-size: 14px;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .compose-actions .primary { background: var(--active-text-blue); color: #fff; }
        .compose-actions .secondary { background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-color); }
        .compose-actions input[type="file"] { display: none; }

        .posts-wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
        .post-card {
            background: var(--card-gradient); border-radius: 24px; padding: 22px; border: 1px solid var(--border-color);
            backdrop-filter: blur(20px); display: flex; flex-direction: column; gap: 14px;
        }
        .post-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
        .post-meta { display: flex; flex-direction: column; gap: 4px; }
        .post-title { font-size: 18px; font-weight: 800; color: var(--text-main); }
        .post-sub { font-size: 13px; color: var(--text-muted); }
        .post-body { color: var(--text-main); line-height: 1.7; white-space: pre-wrap; font-size: 15px; }
        .post-image { width: 100%; border-radius: 18px; border: 1px solid var(--border-color); max-height: 420px; object-fit: cover; }
        .post-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; border-top: 1px solid var(--divider-col); padding-top: 14px; }
        .action-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .action-btn {
            border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); border-radius: 14px;
            padding: 10px 14px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
        }
        .action-btn.like.liked { color: #ef4444; background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.2); }
        .action-btn.danger { color: #ef4444; }

        .empty-state {
            max-width: 760px; margin: 0 auto; padding: 36px 24px; text-align: center;
            border: 1px dashed var(--border-color); border-radius: 24px; color: var(--text-muted); background: var(--card-gradient);
        }

        .secure-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.62); backdrop-filter: blur(10px);
            z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        #editModalInner {
            width: min(720px, 100%); border-radius: 24px; border: 1px solid var(--border-color); background: var(--bg-panel);
            padding: 20px; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        #toastNotif {
            display:none; position:fixed; top:40px; left:50%; transform:translateX(-50%); z-index:99999;
            background:rgba(20,25,35,0.85); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.08);
            border-radius:50px; padding:10px 24px 10px 10px; align-items:center; gap:14px;
            box-shadow:0 20px 40px rgba(0,0,0,0.5); min-width:max-content; max-width:90vw;
        }
        #toastNotif .mt-icon { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; flex-shrink:0; }
        #toastNotif .mt-text { font-size:14px; font-weight:600; color:#f8fafc; padding-right:8px; }

        @media (max-width: 768px) {
            header { padding: env(safe-area-inset-top) 16px 0 16px; height: calc(64px + env(safe-area-inset-top)); }
            .header-container { grid-template-columns: 1fr; gap: 12px; }
            .header-left, .header-center, .header-right { justify-content: center; }
            .main-content { margin-left: 0; padding: calc(95px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom)) 14px; }
            .hero-bar, .compose, .posts-wrap, .market-filter-bar { max-width: 100%; }
            .hero-bar { flex-direction: column; align-items: flex-start; }
            .hero-actions { width: 100%; justify-content: flex-start; }
            .premium-search-btn span { display: none; }
            .post-card { border-radius: 0; }
        }
    </style>
</head>
<body>
    <i class="fa-solid fa-helmet-safety bg-watermark"></i>

    <header>
        <div class="header-container">
            <div class="header-left">
                <button type="button" class="header-btn primary" id="openComposeBtn" style="display: none;" onclick="document.getElementById('composeBox').style.display='block'; document.getElementById('composeBox').scrollIntoView({behavior:'smooth', block:'start'});"><i class="fa-solid fa-plus"></i> <span>{% trans "Post yaratish" %}</span></button>
            </div>
            <div class="header-center">
                <a href="/" class="logo" style="color: var(--text-main); font-size: 26px;">BarberGo</a>
            </div>
            <div class="header-right" style="display: flex; gap: 14px; align-items: center;">
                <button type="button" class="btn-link" id="themeBtn" style="padding: 10px 12px;"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
                <div id="headerRight" style="display: flex; align-items: center; gap: 14px;"></div>
            </div>
        </div>
    </header>

    <main class="main-content">

        <section class="market-filter-bar">
            <div class="search-wrapper">
                <div class="search-inner">
                    <i class="fa-solid fa-magnifying-glass search-icon-premium"></i>
                    <input type="text" id="searchInput" class="premium-search-input" placeholder="{% trans 'Postlarni qidirish...' %}">
                    <button type="button" class="premium-search-btn" id="refreshBtn"><i class="fa-solid fa-rotate"></i><span>{% trans "Yangilash" %}</span></button>
                </div>
            </div>
        </section>

        <section class="compose" id="composeBox" style="display:none;">
            <div class="compose-head">
                <h2>{% trans "Yangi post" %}</h2>
                <button type="button" class="btn-link" id="closeComposeBtn">{% trans "Yopish" %}</button>
            </div>
            <form id="composeForm" onsubmit="event.preventDefault(); window.submitComposeForm(event); return false;">
                {% csrf_token %}
                <div class="compose-grid">
                    <input type="text" id="postTitle" placeholder="{% trans 'Sarlavha' %}">
                    <textarea id="postDescription" placeholder="{% trans 'Tavsif' %}"></textarea>
                    <div class="compose-actions">
                        <label class="secondary" for="postImage"><i class="fa-regular fa-image"></i> {% trans "Rasm" %}</label>
                        <input type="file" id="postImage" accept="image/*">
                        <label class="secondary" for="postVideo"><i class="fa-regular fa-circle-play"></i> {% trans "Video" %}</label>
                        <input type="file" id="postVideo" accept="video/*">
                        <button type="button" id="savePostBtn" onclick="window.submitComposeForm(event)" class="primary"><i class="fa-solid fa-paper-plane"></i> {% trans "Saqlash" %}</button>
                    </div>
                </div>
            </form>
        </section>

        <section id="postsContainer" class="posts-wrap"></section>
        <!-- DEBUG PANEL - muammoni aniqlash uchun, keyin olib tashlash mumkin -->
        <div id="debugPanel" style="max-width:760px;margin:12px auto;padding:14px 18px;background:rgba(0,0,0,0.06);border:1px solid rgba(0,0,0,0.12);border-radius:14px;font-size:12px;font-family:monospace;display:none;">
            <div style="font-weight:700;margin-bottom:6px;color:var(--active-text-blue);">🛠 Debug Info</div>
            <div id="debugContent" style="color:var(--text-muted);line-height:1.8;white-space:pre-wrap;word-break:break-all;"></div>
            <button onclick="document.getElementById('debugPanel').style.display='none'" style="margin-top:8px;padding:4px 10px;border-radius:8px;border:1px solid rgba(0,0,0,0.2);cursor:pointer;font-size:11px;">Yopish</button>
        </div>
    </main>

    <div id="editModal" class="secure-modal-overlay">
        <div id="editModalInner">
            <div class="compose-head" style="margin-bottom: 16px;">
                <h2>{% trans "Postni tahrirlash" %}</h2>
                <button type="button" class="btn-link" id="closeEditBtn">{% trans "Yopish" %}</button>
            </div>
            <form id="editForm" onsubmit="event.preventDefault(); window.submitEditForm(event); return false;">
                {% csrf_token %}
                <input type="hidden" id="editPostId">
                <div class="compose-grid">
                    <input type="text" id="editPostTitle">
                    <textarea id="editPostDescription"></textarea>
                    <div class="compose-actions">
                        <label class="secondary" for="editPostImage"><i class="fa-regular fa-image"></i> {% trans "Yangi rasm" %}</label>
                        <input type="file" id="editPostImage" accept="image/*">
                        <label class="secondary" for="editPostVideo"><i class="fa-regular fa-circle-play"></i> {% trans "Yangi video" %}</label>
                        <input type="file" id="editPostVideo" accept="video/*">
                        <button type="button" id="saveEditBtn" onclick="window.submitEditForm(event)" class="primary"><i class="fa-solid fa-floppy-disk"></i> {% trans "Yangilash" %}</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="toastNotif"><div id="toastIcon" class="mt-icon"></div><div id="toastMsg" class="mt-text"></div></div>

    <script>
        const API = {
            posts: '/posts/posts/',
            login: '/accounts/auth-jwt/login/',
            me: '/accounts/auth-jwt/me/',
            register: '/step-1/',
        };

        function getToken() {
            const raw = localStorage.getItem('access_token');
            if (!raw) return '';
            return String(raw).trim().replace(/^Bearer\s+/i, '').replace(/^"|"$/g, '');
        }

 function decodeJwtPayload(token) {
    try {
        const payload = token.split('.')[1];
        const json = atob(payload.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(payload.length / 4) * 4, '='));
        return JSON.parse(json);
    } catch {
        return null;
    }
}

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function formatUserLabel(user) {
    if (user && typeof user === 'object') {
        return user.username ? `@${user.username}` : (user.id ? `User #${user.id}` : '-');
    }
    return user ? `User #${user}` : '-';
}

function csrfToken() {
    const el = document.querySelector('[name=csrfmiddlewaretoken]');
    return el ? el.value : '';
}

function showToast(type, message) {
    const toastEl = document.getElementById('toastNotif');
    const iconEl = document.getElementById('toastIcon');
    const msgEl = document.getElementById('toastMsg');
    if (!toastEl || !iconEl || !msgEl) return;

    const configs = {
        success: { icon: '<i class="fa-solid fa-check"></i>', bg: 'linear-gradient(135deg, #10b981, #059669)' },
        error: { icon: '<i class="fa-solid fa-xmark"></i>', bg: 'linear-gradient(135deg, #ef4444, #dc2626)' },
        warning: { icon: '<i class="fa-solid fa-exclamation"></i>', bg: 'linear-gradient(135deg, #f59e0b, #d97706)' },
        info: { icon: '<i class="fa-solid fa-info"></i>', bg: 'linear-gradient(135deg, #3b82f6, #2563eb)' }
    };
    const cfg = configs[type] || configs.info;
    iconEl.innerHTML = cfg.icon;
    iconEl.style.background = cfg.bg;
    msgEl.textContent = message;
    toastEl.style.display = 'flex';
    clearTimeout(toastEl._timeout);
    toastEl._timeout = setTimeout(() => { toastEl.style.display = 'none'; }, 2800);
}

function authHeaders(extra = {}) {
    const token = getToken();
    const headers = { ...extra };
    if (token) headers.Authorization = 'Bearer ' + token;
    return headers;
}

function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    const icon = document.getElementById('themeIcon');
    if (icon) icon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}

function initTheme() {
    const saved = localStorage.getItem('theme') || 'light';
    setTheme(saved);
    const themeBtn = document.getElementById('themeBtn');
    if (themeBtn) {
        themeBtn.onclick = () => {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        };
    }
}

function renderHeader() {
    const headerRight = document.getElementById('headerRight');
    if (!headerRight) return;
    const token = getToken();
    const payload = token ? (decodeJwtPayload(token) || {}) : {};
    const username = payload.username || 'user';

    headerRight.innerHTML = `
        <span style="font-size:13px;color:var(--text-muted);font-weight:700;">@${username}</span>
        <img src="https://ui-avatars.com/api/?name=${username}&background=random" class="profile-avatar" alt="Profile">
        <button type="button" class="btn-link" id="logoutBtn" style="padding: 10px 14px;"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    `;

    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
        logoutBtn.onclick = () => {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            window.location.reload();
        };
    }
}

// fetchPosts: xato bo'lsa aniq status va xabarni qaytaradi
// Debug helper
function showDebug(source, status, data) {
    const panel = document.getElementById('debugPanel');
    const content = document.getElementById('debugContent');
    if (!panel || !content) return;
    panel.style.display = 'block';
    const token = getToken();
    const payload = token ? decodeJwtPayload(token) : null;
    content.textContent = [
        'Token mavjud: ' + (token ? 'Ha (' + token.substring(0,20) + '...)' : 'Yo\'q'),
        'Token payload: ' + JSON.stringify(payload),
        '---',
        source + ' status: ' + status,
        source + ' javob: ' + JSON.stringify(data)
    ].join('\n');
}

async function fetchPosts() {
    try {
        const res = await fetch(API.posts, {
            headers: authHeaders(),
            cache: 'no-store'
        });

        console.log('[fetchPosts] status:', res.status);

        if (!res.ok) {
            let errMsg = 'Postlar yuklanmadi (' + res.status + ')';
            try {
                const errData = await res.json();
                console.error('[fetchPosts] server xatosi:', errData);
                errMsg = errData.detail || errData.error || errMsg;
            } catch (_) {}

            if (res.status === 401) errMsg = "Token yaroqsiz — qayta login qiling";
            if (res.status === 403) errMsg = "Ruxsat yo'q (403)";

            return { error: errMsg, status: res.status };
        }

        const data = await res.json();
        console.log('[fetchPosts] data:', data);

        showDebug('fetchPosts', res.status, data);
        if (Array.isArray(data)) return { posts: data };
        if (data && Array.isArray(data.results)) return { posts: data.results };
        return { posts: [] };
    } catch (err) {
        console.error('[fetchPosts] network xatosi:', err);
        return { error: 'Server bilan ulanishda xatolik: ' + err.message };
    }
}

function postHtml(post, currentUserId) {
    const title = escapeHtml(post.title || 'Post');
    const description = escapeHtml(post.description || '').replace(/\n/g, '<br>');
    const image = post.image ? `<img src="${escapeHtml(post.image)}" class="post-image" alt="post image">` : '';
    const video = post.video ? `<a href="${escapeHtml(post.video)}" target="_blank" rel="noopener noreferrer" class="btn-link" style="width:max-content;">{% trans "Video" %}</a>` : '';

    // User ID obyekt yoki oddiy raqam bo'lganda ham to'g'ri tekshiradi
    const postUserId = typeof post.user === 'object' ? post.user?.id : post.user;
    const canEdit = currentUserId && String(currentUserId) === String(postUserId);
    const likes = Number(post.like_count ?? post.likes ?? 0);

    return `
        <article class="post-card" id="post-card-${post.id}" data-search="${escapeHtml((post.title || '') + ' ' + (post.description || '')).toLowerCase()}">
            <div class="post-top">
                <div class="post-meta">
                    <div class="post-title">${title}</div>
                    <div class="post-sub">${formatUserLabel(post.user)} · ${escapeHtml(post.created_at || '')}</div>
                </div>
                <div class="post-sub">${post.id ? '#' + post.id : ''}</div>
            </div>
            <div class="post-body">${description}</div>
            ${image}
            <div style="display:flex;gap:10px;flex-wrap:wrap;">${video}</div>
            <div class="post-actions">
                <div class="action-group">
                    <button type="button" class="action-btn like" data-id="${post.id}">
                        <i class="fa-regular fa-heart"></i> <span class="like-count">${likes}</span>
                    </button>
                </div>
                ${canEdit ? `
                    <div class="action-group">
                        <button type="button" class="action-btn edit-btn" data-edit-id="${post.id}"><i class="fa-regular fa-pen-to-square"></i> {% trans "Tahrirlash" %}</button>
                        <button type="button" class="action-btn danger delete-btn" data-delete-id="${post.id}"><i class="fa-regular fa-trash-can"></i> {% trans "O'chirish" %}</button>
                    </div>
                ` : ''}
            </div>
        </article>
    `;
}

let postsDataList = []; // Global saqlash

async function renderFeed() {
    const token = getToken();
    const postsContainer = document.getElementById('postsContainer');
    if (!postsContainer) return;

    // Yuklanmoqda holati
    postsContainer.innerHTML = `
        <div class="empty-state" style="display:flex;align-items:center;justify-content:center;gap:12px;">
            <i class="fa-solid fa-spinner fa-spin" style="color:var(--active-text-blue);"></i>
            <span>Yuklanmoqda...</span>
        </div>`;

    if (!token) {
        const composeBox = document.getElementById('composeBox');
        if (composeBox) composeBox.style.display = 'none';
        const openComposeBtn = document.getElementById('openComposeBtn');
        if (openComposeBtn) openComposeBtn.style.display = 'none';
        postsContainer.innerHTML = `<div class="empty-state">Postlarni ko'rish uchun avval tizimga kiring.</div>`;
        return;
    }

    const payload = decodeJwtPayload(token) || {};
    const currentUserId = payload.user_id || payload.id || payload.sub;
    const isBarber = payload.role === 'barber';

    const openComposeBtn = document.getElementById('openComposeBtn');
    if (openComposeBtn) openComposeBtn.style.display = isBarber ? 'inline-flex' : 'none';

    const composeBox = document.getElementById('composeBox');
    if (composeBox && !isBarber) composeBox.style.display = 'none';

    const result = await fetchPosts();

    // Xato bo'lsa aniq ko'rsatamiz
    if (result.error) {
        postsContainer.innerHTML = `
            <div class="empty-state" style="border-color:rgba(239,68,68,0.3);">
                <i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;font-size:24px;margin-bottom:8px;"></i><br>
                <strong style="color:#ef4444;">${escapeHtml(result.error)}</strong><br>
                <span style="font-size:13px;margin-top:6px;display:block;">Muammo backend tomonida bo'lishi mumkin. Console'ni tekshiring.</span>
            </div>`;
        showToast('error', result.error);
        return;
        showDebug('fetchPosts (xato)', result.status, result.error);
    }

    postsDataList = result.posts || [];

    showDebug('fetchPosts (muvaffaqiyat)', 'OK', postsDataList.slice(0,2));
    if (!postsDataList.length) {
        postsContainer.innerHTML = `<div class="empty-state"><i class="fa-regular fa-note-sticky" style="font-size:28px;margin-bottom:10px;"></i><br>Hozircha postlar yo'q.</div>`;
        return;
    }

    postsContainer.innerHTML = postsDataList.map(p => postHtml(p, currentUserId)).join('');

    bindPostActions();
    applySearchFilter();
}

function bindPostActions() {
    document.querySelectorAll('.like').forEach(btn => {
        btn.onclick = () => toggleLike(btn.dataset.id, btn);
    });
    document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.onclick = () => openEditModal(btn.dataset.editId);
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.onclick = () => removePost(btn.dataset.deleteId);
    });
}

async function toggleLike(postId, btn) {
    try {
        const res = await fetch(`${API.posts}${postId}/like/`, {
            method: 'POST',
            headers: authHeaders({ 'X-CSRFToken': csrfToken() })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            showToast('error', data.detail || data.error || '{% trans "Like xatosi" %}');
            return;
        }
        const icon = btn.querySelector('i');
        const count = btn.querySelector('.like-count');
        if (data.like) {
            btn.classList.add('liked');
            if (icon) icon.className = 'fa-solid fa-heart';
        } else {
            btn.classList.remove('liked');
            if (icon) icon.className = 'fa-regular fa-heart';
        }
        if (count) count.textContent = data.likes ?? '';
    } catch {
        showToast('error', 'Xatolik yuz berdi');
    }
}

async function removePost(postId) {
    if (!confirm('{% trans "Postni o\'chirishni tasdiqlaysizmi?" %}')) return;
    try {
        const res = await fetch(`${API.posts}${postId}/`, {
            method: 'DELETE',
            headers: authHeaders({ 'X-CSRFToken': csrfToken() })
        });
        if (res.ok) {
            showToast('success', '{% trans "Post o\'chirildi" %}');
            renderFeed();
        } else {
            showToast('error', '{% trans "O\'chirish amalga oshmadi" %}');
        }
    } catch {
        showToast('error', 'Server xatosi');
    }
}

let editingPostId = null;

function openEditModal(postId) {
    editingPostId = postId;
    // Obyektni global ro'yxatdan qidiramiz
    const post = postsDataList.find(p => String(p.id) === String(postId));

    const editTitle = document.getElementById('editPostTitle');
    const editDesc = document.getElementById('editPostDescription');
    const editModal = document.getElementById('editModal');

    if (post) {
        if (editTitle) editTitle.value = post.title || '';
        if (editDesc) editDesc.value = post.description || '';
    }
    if (editModal) editModal.style.display = 'flex';
}

function closeEditModal() {
    const editModal = document.getElementById('editModal');
    if (editModal) editModal.style.display = 'none';
    editingPostId = null;
}

function extractDrfError(data, defaultMsg) {
    if (!data) return defaultMsg;
    if (data.detail) return data.detail;
    if (data.error) return data.error;
    if (typeof data === 'object') {
        const msgs = Object.values(data).flat();
        if (msgs.length > 0 && typeof msgs[0] === 'string') return msgs[0];
    }
    return defaultMsg;
}

window.submitComposeForm = async function(e) {
    if (e && e.preventDefault) e.preventDefault();

    const saveBtn = document.getElementById('savePostBtn') || document.querySelector('#composeForm button');
    if (saveBtn) { saveBtn.disabled = true; saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saqlanmoqda...'; }

    const fd = new FormData();
    const titleVal = document.getElementById('postTitle')?.value?.trim() || '';
    const descVal = document.getElementById('postDescription')?.value?.trim() || '';

    if (!titleVal || !descVal) {
        showToast('warning', 'Sarlavha va tavsifni kiriting');
        if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Saqlash'; }
        return;
    }

    fd.append('title', titleVal);
    fd.append('description', descVal);

    const imgEl = document.getElementById('postImage');
    const vidEl = document.getElementById('postVideo');
    if (imgEl && imgEl.files[0]) fd.append('image', imgEl.files[0]);
    if (vidEl && vidEl.files[0]) fd.append('video', vidEl.files[0]);

    try {
        console.log('[submitComposeForm] POST yuborilmoqda:', API.posts);
        const res = await fetch(API.posts, {
            method: 'POST',
            headers: authHeaders({ 'X-CSRFToken': csrfToken() }),
            body: fd
        });
        const data = await res.json().catch(() => null);
        console.log('[submitComposeForm] server javobi:', res.status, data);

        if (!res.ok) {
            throw new Error(extractDrfError(data, 'Post yaratilmadi (' + res.status + ')'));
        }

        showToast('success', 'Post muvaffaqiyatli yaratildi!');

        // Formani tozalash
        const composeForm = document.getElementById('composeForm');
        if (composeForm) composeForm.reset();
        const composeBox = document.getElementById('composeBox');
        if (composeBox) composeBox.style.display = 'none';

        // Postlarni yangilash
        await renderFeed();

    } catch (err) {
        console.error('[submitComposeForm] xato:', err);
        showToast('error', err.message);
        alert('Xatolik: ' + err.message);
    } finally {
        if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Saqlash'; }
    }
};

window.submitEditForm = async function(e) {
    if (e) e.preventDefault();
    if (!editingPostId) return;

    const fd = new FormData();
    const titleVal = document.getElementById('editPostTitle')?.value?.trim() || '';
    const descVal = document.getElementById('editPostDescription')?.value?.trim() || '';

    fd.append('title', titleVal);
    fd.append('description', descVal);

    const imgEl = document.getElementById('editPostImage');
    const vidEl = document.getElementById('editPostVideo');
    if (imgEl && imgEl.files[0]) fd.append('image', imgEl.files[0]);
    if (vidEl && vidEl.files[0]) fd.append('video', vidEl.files[0]);

    try {
        const res = await fetch(`${API.posts}${editingPostId}/`, {
            method: 'PATCH',
            headers: authHeaders({ 'X-CSRFToken': csrfToken() }),
            body: fd
        });
        const data = await res.json().catch(() => null);
        if (!res.ok) {
            throw new Error(extractDrfError(data, '{% trans "Post yangilanmadi" %}'));
        }
        showToast('success', '{% trans "Post yangilandi" %}');
        closeEditModal();
        renderFeed();
    } catch (err) {
        showToast('error', err.message);
    }
}

function applySearchFilter() {
    const input = document.getElementById('searchInput');
    if (!input) return;
    input.oninput = () => {
        const q = input.value.trim().toLowerCase();
        document.querySelectorAll('.post-card').forEach(card => {
            const text = card.getAttribute('data-search') || '';
            card.style.display = text.includes(q) ? '' : 'none';
        });
    };
}

// Barcha tugmalarga va formalarga Event'larni biriktirish
document.addEventListener('DOMContentLoaded', () => {
    // URL dagi ?csrfmiddlewaretoken=... parametrlarini tozalaymiz
    if (window.location.search) {
        window.history.replaceState({}, document.title, window.location.pathname);
    }
    initTheme();
    renderHeader();
    renderFeed();

    // Yaratish formasi EventListener - faqat bir marta biriktiriladi
    const composeForm = document.getElementById('composeForm');
    if (composeForm) {
        composeForm.addEventListener('submit', function(e) {
            e.preventDefault();
            submitComposeForm(e);
        });
    }

    // Tahrirlash formasi EventListener
    const editForm = document.getElementById('editForm');
    if (editForm) {
        editForm.addEventListener('submit', function(e) {
            e.preventDefault();
            submitEditForm(e);
        });
    }

    // Modalni yopish va ochish tugmalari
    const refreshBtn = document.getElementById('refreshBtn');
    if (refreshBtn) refreshBtn.onclick = renderFeed;

    const openComposeBtn = document.getElementById('openComposeBtn');
    if (openComposeBtn) {
        openComposeBtn.onclick = () => {
            const composeBox = document.getElementById('composeBox');
            if (composeBox) {
                composeBox.style.display = 'block';
                composeBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };
    }

    const closeComposeBtn = document.getElementById('closeComposeBtn');
    if (closeComposeBtn) {
        closeComposeBtn.onclick = () => {
            const composeBox = document.getElementById('composeBox');
            if (composeBox) composeBox.style.display = 'none';
        };
    }

    const closeEditBtn = document.getElementById('closeEditBtn');
    if (closeEditBtn) closeEditBtn.onclick = closeEditModal;

    const editModal = document.getElementById('editModal');
    if (editModal) {
        editModal.onclick = (e) => {
            if (e.target === editModal) closeEditModal();
        };
    }
});
