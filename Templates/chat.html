{% extends "base.html" %}
{% load static %}
{% block title %}Suhbatlar{% endblock %}

{% block content %}
<div class="chat-app">
    <aside class="chat-list-panel">
        <div class="chat-search">
            <input type="text" id="roomSearch" placeholder="Qidiruv...">
        </div>
        <div id="roomListItems" class="room-list"></div>
        <div id="chatAuthMsg" style="display:none; padding:2rem 1rem; text-align:center; color:var(--text-muted); font-size:14px;">
            Suhbatlarni ko'rish uchun <a href="/login/">tizimga kiring</a>.
        </div>
        <div id="chatEmptyMsg" style="display:none; padding:2rem 1rem; text-align:center; color:var(--text-muted); font-size:14px;">
            Hozircha suhbatlar yo'q.
        </div>
    </aside>

    <section class="chat-active-panel">
        <div id="chatPlaceholder" class="chat-placeholder">Suhbatni tanlang</div>
        <div id="chatConversation" style="display:none; flex-direction:column; height:100%;">
            <div class="chat-active-header">
                <div class="chat-active-who">
                    <div class="avatar-circle" id="chatAvatar">?</div>
                    <div>
                        <div class="chat-active-name" id="chatName">—</div>
                        <div class="chat-active-status" id="chatStatus">—</div>
                    </div>
                </div>
                <button class="chat-menu-btn" title="Ko'proq">⋮</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-row">
                <button class="chat-icon-btn" title="Hozircha ishlamaydi" disabled>📎</button>
                <input type="text" id="chatInput" placeholder="Xabar yozing...">
                <button class="chat-icon-btn" title="Hozircha ishlamaydi" disabled>🙂</button>
                <button class="chat-send-btn" id="chatSendBtn" title="Yuborish">➤</button>
            </div>
        </div>
    </section>
</div>

<style>
.chat-app { display: flex; height: calc(100vh - 100px); background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--border-radius); overflow: hidden; box-shadow: var(--shadow-sm); }
.chat-list-panel { width: 320px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; }
.chat-search { padding: 16px; border-bottom: 1px solid var(--border-color); }
.chat-search input { width: 100%; padding: 10px 14px; border-radius: 20px; border: 1px solid var(--border-color); outline: none; font-family: var(--font-family); }
.chat-search input:focus { border-color: var(--accent-primary); }

.room-item { display: flex; gap: 12px; padding: 14px 16px; cursor: pointer; border-left: 3px solid transparent; transition: var(--transition); }
.room-item:hover { background: var(--bg-primary); }
.room-item.active { background: #fff7ed; border-left-color: var(--accent-primary); }

.avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-secondary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; }
.room-item-body { flex: 1; min-width: 0; }
.room-item-top { display: flex; justify-content: space-between; align-items: baseline; }
.room-item-name { font-weight: 600; font-size: 14px; }
.room-item-time { font-size: 12px; color: var(--text-muted); }
.room-item-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; gap: 6px; }
.room-item-last { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-item-badge { background: var(--accent-primary); color: #fff; font-size: 11px; font-weight: 600; border-radius: 50%; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; padding: 0 4px; flex-shrink: 0; }

.chat-active-panel { flex: 1; display: flex; flex-direction: column; }
.chat-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }

.chat-active-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border-color); }
.chat-active-who { display: flex; align-items: center; gap: 12px; }
.chat-active-name { font-weight: 600; font-size: 15px; }
.chat-active-status { font-size: 12px; color: var(--text-muted); }
.chat-menu-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); }

.chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: var(--bg-primary); }
.msg { max-width: 60%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; }
.msg.mine { align-self: flex-end; background: var(--accent-primary); color: #fff; border-bottom-right-radius: 4px; }
.msg.theirs { align-self: flex-start; background: #fff; border: 1px solid var(--border-color); border-bottom-left-radius: 4px; }
.msg small { display: block; opacity: 0.75; font-size: 11px; margin-top: 4px; text-align: right; }

.chat-input-row { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border-color); }
.chat-icon-btn { background: none; border: none; font-size: 18px; opacity: 0.4; cursor: not-allowed; }
#chatInput { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid var(--border-color); outline: none; font-family: var(--font-family); }
#chatInput:focus { border-color: var(--accent-primary); }
.chat-send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-primary); color: #fff; border: none; cursor: pointer; font-size: 16px; flex-shrink: 0; }
</style>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('access_token');
    const userDataRaw = localStorage.getItem('user_data');
    const authMsg = document.getElementById('chatAuthMsg');
    const emptyMsg = document.getElementById('chatEmptyMsg');
    const listPanel = document.getElementById('roomListItems');
    const placeholder = document.getElementById('chatPlaceholder');
    const conversation = document.getElementById('chatConversation');

    if (!token || !userDataRaw) {
        authMsg.style.display = 'block';
        return;
    }

    const currentUser = JSON.parse(userDataRaw);
    const preselectOrderId = "{{ order_id|default:'' }}";
    let socket = null;

    function formatTime(iso) {
        return new Date(iso).toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    function loadRooms() {
        apiCall('/chat/rooms/')
            .then(res => res.ok ? res.json() : [])
            .then(rooms => {
                if (!rooms.length) {
                    emptyMsg.style.display = 'block';
                    return;
                }
                renderRoomList(rooms);
                if (preselectOrderId) {
                    const match = rooms.find(r => String(r.order_id) === String(preselectOrderId));
                    if (match) openRoom(match);
                }
            })
            .catch(() => {});
    }

    function renderRoomList(rooms) {
        listPanel.innerHTML = rooms.map(r => `
            <div class="room-item" data-order="${r.order_id}">
                <div class="avatar-circle">${(r.other_user_name || '?').charAt(0).toUpperCase()}</div>
                <div class="room-item-body">
                    <div class="room-item-top">
                        <span class="room-item-name">${escapeHtml(r.other_user_name || 'Foydalanuvchi')}</span>
                        <span class="room-item-time">${r.last_message_time ? formatTime(r.last_message_time) : ''}</span>
                    </div>
                    <div class="room-item-bottom">
                        <span class="room-item-last">${r.last_message ? escapeHtml(r.last_message) : "Hali xabar yo'q"}</span>
                        ${r.unread_count ? `<span class="room-item-badge">${r.unread_count}</span>` : ''}
                    </div>
                </div>
            </div>
        `).join('');

        listPanel.querySelectorAll('.room-item').forEach(el => {
            el.addEventListener('click', () => {
                const room = rooms.find(r => String(r.order_id) === el.dataset.order);
                openRoom(room);
            });
        });
    }

    function openRoom(room) {
        document.querySelectorAll('.room-item').forEach(el => {
            el.classList.toggle('active', el.dataset.order === String(room.order_id));
        });

        placeholder.style.display = 'none';
        conversation.style.display = 'flex';
        document.getElementById('chatName').textContent = room.other_user_name || 'Foydalanuvchi';
        document.getElementById('chatStatus').textContent = `Buyurtma #${room.order_id}`;
        document.getElementById('chatAvatar').textContent = (room.other_user_name || '?').charAt(0).toUpperCase();
        document.getElementById('chatMessages').innerHTML = '';

        if (socket) socket.close();

        apiCall(`/chat/${room.order_id}/messages/`)
            .then(res => res.ok ? res.json() : [])
            .then(messages => messages.forEach(appendMessage))
            .catch(() => {});

        const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
        socket = new WebSocket(`${wsProtocol}://${location.host}/ws/chat/${room.order_id}/?token=${token}`);
        socket.onmessage = (e) => appendMessage(JSON.parse(e.data));
        socket.onclose = () => console.warn('Chat ulanishi uzildi');
    }

    function appendMessage(data) {
        const messagesEl = document.getElementById('chatMessages');
        const isMine = (data.sender === currentUser.id || data.sender_id === currentUser.id);
        const div = document.createElement('div');
        div.className = 'msg ' + (isMine ? 'mine' : 'theirs');
        const textEl = document.createElement('div');
        textEl.textContent = data.text;
        div.appendChild(textEl);
        const meta = document.createElement('small');
        meta.textContent = formatTime(data.created_at) + (isMine ? ' ✓' : '');
        div.appendChild(meta);
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !socket || socket.readyState !== 1) return;
        socket.send(JSON.stringify({ message: text }));
        input.value = '';
    }

    document.getElementById('chatSendBtn').addEventListener('click', sendMessage);
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    loadRooms();
});
</script>
{% endblock %}
