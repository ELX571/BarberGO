{% extends 'base.html' %}
{% load static %}

{% block title %}Filtrlar - BarberGo{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/filters.css' %}?v=1">
{% endblock %}

{% block content %}
<div class="filters-page fade-in">
    
    <div class="filters-header" data-aos="fade-down">
        <h1>Batafsil Filtrlar</h1>
        <p>O'zingizga kerakli sartaroshni oson toping</p>
    </div>

    <div class="filter-card" data-aos="fade-up" data-aos-delay="100">
        <div class="filter-group">
            <label>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Xizmat turi
            </label>
            <div class="filter-options">
                <button class="filter-tag active" onclick="toggleTag(this)">Soch qisqartirish</button>
                <button class="filter-tag" onclick="toggleTag(this)">Soqol tekislash</button>
                <button class="filter-tag" onclick="toggleTag(this)">Soch bo'yash</button>
                <button class="filter-tag" onclick="toggleTag(this)">Bolalar uchun</button>
                <button class="filter-tag" onclick="toggleTag(this)">Uqalash (Massaj)</button>
                <button class="filter-tag" onclick="toggleTag(this)">Yuz parvarishi</button>
            </div>
        </div>
    </div>

    <div class="filter-card" data-aos="fade-up" data-aos-delay="150">
        <div class="filter-group">
            <label>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                Hudud / Joylashuv
            </label>
            <div class="location-inputs" style="display: flex; flex-direction: column; gap: 16px;">
                <!-- Premium Input Field -->
                <div style="position: relative; display: flex; align-items: center;">
                    <svg style="position: absolute; left: 14px; color: #94a3b8;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="locationSearchInput" placeholder="Shahar, tuman yoki manzil..." style="width: 100%; padding: 14px 14px 14px 42px; border-radius: 14px; border: 1px solid rgba(226, 232, 240, 1); background: #f8fafc; font-size: 14px; color: #1e293b; transition: all 0.3s; outline: none;" onfocus="this.style.background='#fff'; this.style.borderColor='#ef6c00'; this.style.boxShadow='0 0 0 4px rgba(239, 108, 0, 0.1)';" onblur="this.style.background='#f8fafc'; this.style.borderColor='rgba(226, 232, 240, 1)'; this.style.boxShadow='none';">
                </div>
                
                <!-- Divider -->
                <div style="display: flex; align-items: center; gap: 12px; margin: 2px 0;">
                    <div style="flex: 1; height: 1px; background: linear-gradient(90deg, rgba(226, 232, 240, 0), rgba(226, 232, 240, 1));"></div>
                    <span style="font-size: 11px; color: #94a3b8; font-weight: 700; letter-spacing: 1px;">YOKI</span>
                    <div style="flex: 1; height: 1px; background: linear-gradient(90deg, rgba(226, 232, 240, 1), rgba(226, 232, 240, 0));"></div>
                </div>

                <!-- Premium Button -->
                <button id="locBtn" class="btn-location-detect" onclick="detectCurrentLocation()" style="position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 14px; border: none; background: linear-gradient(135deg, #ef6c00, #f97316); color: #ffffff; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(239, 108, 0, 0.25); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 16px rgba(239, 108, 0, 0.35)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(239, 108, 0, 0.25)';">
                    <svg id="locIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
                    <span id="locationDetectText">Hozirgi joylashuvni aniqlash</span>
                </button>
            </div>
        </div>
    </div>

    <div class="filter-card" data-aos="fade-up" data-aos-delay="200">
        <div class="filter-group">
            <label>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                Narx oralig'i (UZS)
            </label>
            <div class="price-inputs">
                <input type="number" placeholder="dan (masalan: 20000)" class="filter-input">
                <span class="price-divider">—</span>
                <input type="number" placeholder="gacha (masalan: 100000)" class="filter-input">
            </div>
        </div>
    </div>


    <div class="filter-footer" data-aos="fade-up" data-aos-delay="400">
        <button class="btn-reset" onclick="resetFilters()">Filtrni Tozalash</button>
        <button class="btn-apply" onclick="applyFilters()">
            Natijalarni Ko'rish
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
    function toggleTag(el) {
        el.classList.toggle('active');
    }
    
    function resetFilters() {
        const tags = document.querySelectorAll('.filter-tag');
        tags.forEach(t => t.classList.remove('active'));
        
        const inputs = document.querySelectorAll('.filter-input');
        inputs.forEach(i => i.value = '');
        
        const btnText = document.getElementById('locationDetectText');
        if(btnText) btnText.innerText = 'Hozirgi joylashuvni aniqlash';
    }

    function applyFilters() {
        // Backendga tegmasligim kerakligi uchun, bu yerda 
        // oddiy bosh sahifaga (indexga) yo'naltiraman.
        window.location.href = '/';
    }

    function detectCurrentLocation() {
        const btn = document.getElementById('locBtn');
        const btnText = document.getElementById('locationDetectText');
        const searchInput = document.getElementById('locationSearchInput');
        
        if (!navigator.geolocation) {
            btnText.innerText = "Brauzeringiz buni qo'llab-quvvatlamaydi";
            return;
        }

        btnText.innerText = "Aniqlanmoqda...";
        btn.style.opacity = '0.8';
        
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude.toFixed(4);
                const lng = position.coords.longitude.toFixed(4);
                
                // Success State! Premium Green
                btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                btn.style.boxShadow = '0 4px 12px rgba(16, 185, 129, 0.3)';
                btnText.innerText = "Joylashuv aniqlandi ✅";
                btn.style.opacity = '1';
                
                searchInput.value = `${lat}, ${lng}`;
            },
            (error) => {
                btnText.innerText = "Ruxsat berilmadi yoki xato";
                btn.style.opacity = '1';
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
    }
</script>
{% endblock %}
