{% extends 'base.html' %}
{% load static %}

{% block title %}BarberGo - Bosh Sahifa{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/index.css' %}?v=5">
{% endblock %}

{% block content %}
<div class="home-container fade-in">
    <!-- Big background icon (scissors/razor) -->
    <svg class="bg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"></circle>
        <circle cx="6" cy="18" r="3"></circle>
        <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
        <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
        <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
    </svg>

    <!-- Search Bar -->
    <div class="search-wrapper">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="search-input" placeholder="Kerakli sartarosh yoki xizmatni qidiring...">
        <button class="search-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            Qidirish
        </button>
    </div>

    <!-- Recommended Posts Section -->
    <div id="recommendedSection" class="posts-section" style="width: 100%; max-width: 1200px; margin-top: 4rem; display: none;">
        <h2 style="font-size: 1.5rem; color: var(--accent-primary); margin-bottom: 1.5rem; font-weight: 700;">Tavsiya etiladi (Sizning hudud)</h2>
        <div id="recommendedPostsGrid" class="posts-grid"></div>
    </div>

    <!-- Latest Posts Section -->
    <div class="posts-section" style="width: 100%; max-width: 1200px; margin-top: 3rem; padding-bottom: 4rem;">
        <h2 style="font-size: 1.5rem; color: var(--text-primary); margin-bottom: 1.5rem; font-weight: 700;">So'nggi Postlar</h2>
        <div id="latestPostsGrid" class="posts-grid"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/posts.js' %}?v=5"></script>
{% endblock %}
