version: '3.8'

services:
  web:
    image: ${DOCKERHUB_USERNAME}/barbergo:latest
    container_name: barbergo_web
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - media_data:/app/media
    depends_on:
      - db
      - redis
    networks:
      - barbergo_network

  db:
    image: postgres:15
    container_name: barbergo_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - barbergo_network

  redis:
    image: redis:7
    container_name: barbergo_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - barbergo_network

volumes:
  postgres_data:
  redis_data:
  media_data:

networks:
  barbergo_network:
    driver: bridge
